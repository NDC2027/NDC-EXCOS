<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify NDC EXCO Card</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="topin"><div class="brand"><img src="assets/ndc-logo.jpg"><div><strong>NDC Card Verification</strong><span>Ward • Local Government • State EXCO</span></div></div><nav class="navlinks"><a href="index.html">Registration</a></nav></div><div class="redbar"></div></header><main class="verify-shell"><section class="surface verify-card"><img class="verify-logo" src="assets/ndc-logo.jpg"><h1>EXCO Membership Card Verification</h1><div class="field" style="max-width:500px;margin:0 auto"><label>Membership Number</label><div class="verifyrow"><input id="memberNo" placeholder="Enter membership number"><button id="verifyBtn" class="btn primary">Verify</button></div></div><div id="result"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';import{escapeHtml,levelLabel,jurisdictionText}from'./common.js';const app=initializeApp(firebaseConfig),db=getFirestore(app),$=s=>document.querySelector(s);async function verify(){const no=$('#memberNo').value.trim();if(!no)return;$('#result').innerHTML='<p class="sub" style="margin-top:18px">Checking card status…</p>';try{const s=await getDoc(doc(db,'publicCardVerification',no));if(!s.exists()){bad('No approved EXCO record was found for this membership number.');return}const r=s.data(),active=r.status==='active';$('#result').innerHTML=`<div class="valid ${active?'':'invalid'}">${active?'✓ CURRENT ACTIVE '+escapeHtml(levelLabel(r.excoLevel||'ward').toUpperCase())+' HOLDER':'⚠ CURRENT STATUS: '+escapeHtml(String(r.status).toUpperCase())}</div><div class="verify-grid">${[['Membership Number',r.membershipNo],['Full Name',r.fullName],['EXCO Level',levelLabel(r.excoLevel||'ward')],['Position',r.position],['Jurisdiction',jurisdictionText(r)],['Issuing Authority',r.issuingAuthority]].map(x=>`<div class="verify-item"><div class="k">${escapeHtml(x[0])}</div><div class="v">${escapeHtml(x[1]||'—')}</div></div>`).join('')}</div>`}catch(e){bad('Verification service could not be reached. Check Firebase configuration and Firestore rules.')}}function bad(m){$('#result').innerHTML=`<div class="valid invalid">✕ RECORD NOT CONFIRMED</div><p class="sub">${escapeHtml(m)}</p>`}$('#verifyBtn').onclick=verify;$('#memberNo').addEventListener('keydown',e=>{if(e.key==='Enter')verify()});const q=new URLSearchParams(location.search).get('id');if(q){$('#memberNo').value=q;verify()}</script></body></html>
